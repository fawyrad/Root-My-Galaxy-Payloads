name: SUSFS LKM

# The hiding module this tier publishes, built from its own sources rather than consumed as a release
# asset, for **three variants** and every KMI this project supports - 24 modules per full run.
#
# ## Why this repository builds it
#
# SUSFS is normally a kernel patch, carried inside the same module as KernelSU. The module this
# repository publishes per target has no susfs in it (measured: no `susfs` string in a built
# `kernelsu-next-*.ko`), so on these devices susfs can only arrive as a second module, loaded beside
# it - which is what this workflow builds and what `support/susfs-v1.json` serves.
#
# It is built here, from pinned upstream commits, for one reason: coverage. Upstream's stable line
# builds six KMIs and its own workflow refuses to add the other two, because 6.12 and 6.18 dispatch
# LSM hooks through a static-call table instead of the hlist that `security_hook_heads` was - a
# different mechanism with its own code path. The KMIs this repository supports are eight, and its
# devices include ones on 6.12 and 6.18.
#
# ## The three variants
#
# Upstream keeps more than one implementation line, and they are not interchangeable, so each is
# built and published on its own (`susfs/<variant>/...`) with its own pin:
#
#   stable   `main`    the line upstream calls stable; six KMIs (5.10 x2, 5.15 x2, 6.1, 6.6)
#   preview  `dev`     carries the 6.12/6.18 static-call path, so it is the only variant that can
#                      serve an Android 16/17 device; built for all eight KMIs
#   legacy   `legacy`  the older line, no release string of its own; kept because a phone that
#                      misbehaves on the current line has one other thing to try
#   samsung  `main`     upstream's stable sources with **this repository's hook layer** in place of
#                      theirs: a kretprobe on the SELinux implementation of each hook instead of a
#                      write into security_hook_heads, which Samsung's kernel refuses with -EFAULT
#                      (measured; see susfs-lkm/lsm_hook.c). This is the line built for the DirtyFrag
#                      method, and the only one expected to arm on a stock Samsung kernel.
#
# A variant is not a flavour: one module serves KernelSU, KernelSU-Next and ReSukiSU alike. What
# differs is which implementation a device loads, so nothing here chooses between them for a phone -
# the feed publishes all three and a client decides.
#
# A module is not portable across KMIs: vermagic, KMI and the LSM hook prototypes this module hooks
# by offset all differ. One DDK image per KMI, one module per image and variant, and both the variant
# and the KMI are in the artifact's path and the feed's entry.
#
# ## The loader, and why a module built here can still load on a device
#
# These devices run `CONFIG_MODULE_FORCE_LOAD=n`, so a module whose `vermagic` does not name the
# running kernel release is refused by the kernel. Two answers exist: build the module per device
# release, as the KernelSU pairs in `kernelsu/` are built, or publish the loader that resolves the
# module's unexported symbols out of `/proc/kallsyms` and patches `vermagic=` in `.modinfo` **only
# after the kernel's own message in `/dev/kmsg` asked for it**, retrying `init_module(2)` once.
#
# This tier takes the second: it is what upstream ships for exactly this case, and it keeps one
# module per KMI per variant instead of one per release per KMI. One loader serves all three variants
# because upstream ships the same bytes in its stable and preview releases - the pin below is that
# digest. The loader is not built here; publishing it with a digest is the whole of what this
# repository claims about it.
#
# Loading is privileged kernel code execution on a stock kernel. Nothing in this workflow installs,
# loads or enables anything: it builds, checks and publishes artifacts, and a person decides whether
# a device loads them.

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: 'JSON list of KMIs to build, or empty for all eight'
        required: false
        default: ''
      variants:
        description: 'JSON list of variants to build, or empty for all three'
        required: false
        default: ''
      ddk_release:
        description: 'DDK image release'
        required: false
        default: '20260828'
      publish:
        description: 'Commit susfs/ and support/susfs-v1.json'
        required: false
        type: boolean
        default: false
      url_prefix:
        description: 'Raw-URL prefix the feed serves artifacts from'
        required: false
        default: 'https://raw.githubusercontent.com/rushiranpise/Root-My-Galaxy-Payloads/main'
  push:
    # Only what changes the build: prose about the build is not the build.
    paths:
      - 'tools/susfs_feed.py'
      - '.github/workflows/susfs-lkm.yml'

# Write, because a publish is a commit: the modules into `susfs/` and the feed that points at them.
# Everything else in this workflow only reads.
permissions:
  contents: write

env:
  # Upstream, and one **branch** per variant - not a pinned commit.
  #
  # These used to be commit hashes, and the cost of that showed up today: upstream moved, our line did
  # not, and the gap only exists because nothing rebuilds until somebody edits a hash. A KSU release
  # moves every pair in this repository automatically (`upstream-watch.yml`); susfs is built the same
  # way now, so a rebuild picks up upstream's current sources.
  #
  # What replaces the pin is a record rather than a freeze: every run resolves its branch to a commit
  # *before* building (the download records it in the feed's `source.ref`), so an artifact is still
  # traceable to the revision it came from even though the ref moves. And the guard below - the overlay
  # check - is what keeps a moving upstream from failing silently.
  SUSFS_REPO: inforcqb/susfs4ksu-lkm
  SUSFS_REFS: '{"stable":"main","preview":"dev","legacy":"legacy","samsung":"main"}'
  # The release string each variant's modules answer with, checked against `kernel/susfs.h` before the
  # build and against the binary after it. Null for the legacy line, which carries none: an entry that
  # named a release its binary cannot print would be a claim no reader could check.
  SUSFS_VERSIONS: '{"stable":"2.3.0-gki","preview":"2.3.0-gki","legacy":null,"samsung":"2.3.0-gki"}'
  # The loader is not built here and no longer **pinned** here either. It used to be a release URL and a
  # digest in this file, and that was the last frozen hash in the tier - the reason the first
  # branch-following publish failed, with `sha256sum: 1 computed checksum did NOT match`: upstream's
  # asset had moved and our copy of its digest had not. What replaces it is a resolution and a record:
  # the step below takes the asset from upstream's newest release, refuses anything that is not the
  # loader, and the digest that gets published is computed from the bytes it actually downloaded.
  LOADER_ASSET: susfs_insmod
  URL_PREFIX: ${{ inputs.url_prefix || 'https://raw.githubusercontent.com/rushiranpise/Root-My-Galaxy-Payloads/main' }}

jobs:
  module:
    name: susfs lkm (${{ matrix.variant }}, ${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      # One broken (variant, KMI) pair is a pair to report, not a reason to abandon the other 23 - and
      # the trio of lines is built together on purpose, so a run says which of them is short where.
      fail-fast: false
      matrix:
        # Read from the inputs rather than through `env`, because a matrix is evaluated before the
        # environment exists. The eight KMIs are the ones this project builds for: a device in any of
        # them is a device this project roots.
        kmi: ${{ fromJSON(inputs.kmi || '["android12-5.10","android13-5.10","android13-5.15","android14-5.15","android14-6.1","android15-6.6","android16-6.12","android17-6.18"]') }}
        variant: ${{ fromJSON(inputs.variants || '["stable","preview","legacy","samsung"]') }}
        # The pairs the two older lines cannot build, and this is measured rather than assumed: a run
        # that built them failed with ten errors in `sus_mount.c` against the 6.12 tree (`struct
        # mnt_namespace` has no `ns_lock` and no `list` there, and `MNT_CURSOR` is gone) - the same
        # reason upstream's own stable workflow refuses to add those two KMIs. Only `preview` carries
        # the static-call dispatch that 6.12 and 6.18 need, so they are the two it can serve.
        #
        # Excluded rather than tolerated: a pair built with `continue-on-error` would publish nothing
        # and fail nothing, and the run would read as a success that is short two modules.
        exclude:
          - variant: stable
            kmi: android16-6.12
          - variant: stable
            kmi: android17-6.18
          - variant: legacy
            kmi: android16-6.12
          - variant: legacy
            kmi: android17-6.18
          # `samsung` is upstream's stable sources plus our hook layer, so it carries the stable
          # line's six KMIs for the same reason.
          - variant: samsung
            kmi: android16-6.12
          - variant: samsung
            kmi: android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ inputs.ddk_release || '20260828' }}
      options: --privileged
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7

      - name: The pin and the version this variant claims
        # Both are read here, once, into `$GITHUB_ENV`: every later step compares against the same
        # two values, so a step cannot check one pin and build another.
        run: |
          set -eu
          REF=$(python3 -c "import json,os;print(json.loads(os.environ['SUSFS_REFS'])[os.environ['VARIANT']])")
          VERSION=$(python3 -c "import json,os;v=json.loads(os.environ['SUSFS_VERSIONS'])[os.environ['VARIANT']];print('' if v is None else v)")
          echo "VARIANT_REF=$REF" >> "$GITHUB_ENV"
          echo "VARIANT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "variant $VARIANT: $SUSFS_REPO@$REF (version ${VERSION:-<none>})"
        env:
          VARIANT: ${{ matrix.variant }}

      - name: Checkout the susfs sources at that commit
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SUSFS_REPO }}
          ref: ${{ env.VARIANT_REF }}
          path: susfs-src

      - name: The version the feed will claim is the version in this tree
        run: |
          # Checked before the build, because the feed's `version` is read out of the binary: a run
          # that pinned one commit and recorded another's release would publish an entry whose own
          # artifact disagrees with it, which is what `tools/susfs_feed.py --check` refuses.
          if [ -z "$VARIANT_VERSION" ]; then
            # The legacy line carries no version string at all, and a variant that recorded one
            # anyway would be publishing a claim its own binary cannot answer.
            if grep -q "SUSFS_LKM_VERSION" susfs-src/kernel/susfs.h; then
              echo "::error::this variant carries SUSFS_LKM_VERSION but records no version; set it in SUSFS_VERSIONS"
              grep -n "SUSFS_LKM_VERSION" susfs-src/kernel/susfs.h || true
              exit 1
            fi
            echo "no release string in this line, as recorded"
          else
            grep -q "SUSFS_LKM_VERSION \"$VARIANT_VERSION\"" susfs-src/kernel/susfs.h || {
              echo "::error::susfs-src/kernel/susfs.h does not carry SUSFS_LKM_VERSION \"$VARIANT_VERSION\"; bump SUSFS_VERSIONS with the pin."
              grep -n "SUSFS_LKM_VERSION" susfs-src/kernel/susfs.h || true
              exit 1
            }
            echo "sources carry $VARIANT_VERSION"
          fi

      - name: The overlay still fits the tree it is about to be compiled into
        if: matrix.variant == 'samsung'
        run: |
          # `lsm_hook.c` here is written against upstream's `lsm_hook.h`: the struct, the insert
          # initialiser, and the four entry points it defines. Followed by a branch, that header can
          # change under us - it already has, 46 lines since the commit this line used to be pinned to -
          # and the failures that would cause are the ugly kind: a compile error naming a struct member,
          # or worse, a build that succeeds against a renamed field and a module that installs nothing.
          # So the surface is asserted by name, here, before the build starts.
          set -eu
          header="susfs-src/kernel/lsm_hook.h"
          for token in \
            "struct ksu_lsm_hook" "KSU_LSM_HOOK_INSERT" "KSU_LSM_HOOK_INIT" \
            "head_name" "hook_offset" "replacement" "insert" "struct security_hook_list" \
            "ksu_register_lsm_hook" "ksu_unregister_lsm_hook" "ksu_lsm_hook_init" "ksu_lsm_hook_exit" \
          ; do
            grep -q "$token" "$header" || {
              echo "::error::upstream's lsm_hook.h no longer declares '$token', which our hook layer is"
              echo "::error::written against. Update susfs-lkm/lsm_hook.c for the new API before building."
              exit 1
            }
          done
          echo "overlay surface present in $header ($(git -C susfs-src rev-parse --short HEAD))"

      - name: This repository's hook layer, where the variant is the Samsung one
        if: matrix.variant == 'samsung'
        run: |
          # The one thing `samsung` is: upstream's sources with our install path in place. Upstream
          # publishes a hook by writing it into read-only `__lsm_ro_after_init` memory, which lands on
          # GKI and returns -EFAULT on this project's devices - so the file is replaced, not patched:
          # a diff of it against upstream's would be the whole file.
          cp susfs-lkm/lsm_hook.c susfs-src/kernel/lsm_hook.c
          # Checked rather than assumed: the build below reads whatever is in the tree, and the one
          # failure mode that would look like success is a copy that did not happen and an artifact
          # that is upstream's stable module with our name on it.
          # The marker is the line `ksu_lsm_hook_init()` prints, which only this repository's file has.
          grep -q "install path is kprobe-based" susfs-src/kernel/lsm_hook.c || {
            echo "::error::susfs-lkm/lsm_hook.c was not copied into the checkout"
            exit 1
          }
          if grep -q "ksu_lsm_hook_patch_slot" susfs-src/kernel/lsm_hook.c; then
            echo "::error::the checkout still holds upstream's read-only-memory install path"
            exit 1
          fi
          echo "hook layer: this repository's kretprobe install path"
          # The control nodes are the same story in a smaller way: upstream creates `/proc/susfs_*`
          # unless `expose_proc=0`, and hides them per caller rather than not creating them. A node that
          # exists and answers ENOENT to `stat` is still openable through O_PATH, and readlinkat on the
          # pinned fd still resolves it - which is what the public detectors read. So this variant does
          # not create them at all, and control stays with the supercall the module's own tools use.
          grep -qx 'bool susfs_expose_proc = true;' susfs-src/kernel/susfs_main.c || {
            echo "::error::upstream moved the expose_proc default; this variant must not ship the control nodes"
            exit 1
          }
          sed -i 's/^bool susfs_expose_proc = true;$/bool susfs_expose_proc = false;/' susfs-src/kernel/susfs_main.c
          grep -qx 'bool susfs_expose_proc = false;' susfs-src/kernel/susfs_main.c || {
            echo "::error::the expose_proc default did not change in the samsung variant"
            exit 1
          }
          echo "control nodes: expose_proc defaults to false"

      - name: Build susfs_guard_lkm.ko
        run: |
          # `pipefail`, because the output is teed and the checks below read that file: a build that
          # failed would otherwise be read as a build that printed nothing.
          set -o pipefail
          : "${KDIR:?the DDK image is expected to set KDIR}"
          make -C "$KDIR" M="$PWD/susfs-src/kernel" \
            ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            -j"$(nproc)" modules 2>&1 | tee /tmp/lkm-build.log
          ls -l susfs-src/kernel/susfs_guard_lkm.ko

      - name: Keep the symbol table, drop the debug info
        run: |
          # Not tidiness. The loader resolves this module's unexported symbols by rewriting entries in
          # its ELF symbol table, so `.symtab` has to survive - while the upstream build carries full
          # `debug_info`, which is most of the file and is for a build machine rather than a phone.
          cd susfs-src/kernel
          before=$(stat -c %s susfs_guard_lkm.ko)
          llvm-strip -d susfs_guard_lkm.ko
          after=$(stat -c %s susfs_guard_lkm.ko)
          echo "size: $before -> $after bytes"
          llvm-nm --defined-only susfs_guard_lkm.ko | head -5
          modinfo ./susfs_guard_lkm.ko | head -6

      - name: It is this module, and it says which release it is
        run: |
          # One check, and it is the feed's own reader rather than a second opinion about it: the
          # module has to name itself, and to carry the release string when its variant declares one.
          cp susfs-src/kernel/susfs_guard_lkm.ko "susfs_guard_lkm-${{ matrix.kmi }}.ko"
          python3 tools/susfs_feed.py --self-test
          if [ -n "$VARIANT_VERSION" ]; then
            python3 tools/susfs_feed.py --check "susfs_guard_lkm-${{ matrix.kmi }}.ko" "${{ matrix.variant }}" --version "$VARIANT_VERSION"
          else
            python3 tools/susfs_feed.py --check "susfs_guard_lkm-${{ matrix.kmi }}.ko" "${{ matrix.variant }}"
          fi
          ls -l "susfs_guard_lkm-${{ matrix.kmi }}.ko"
          echo "sha256: $(sha256sum "susfs_guard_lkm-${{ matrix.kmi }}.ko" | cut -d' ' -f1)"

      - name: Upload the module
        uses: actions/upload-artifact@v7
        with:
          name: susfs-lkm-${{ matrix.variant }}-${{ matrix.kmi }}
          path: susfs_guard_lkm-${{ matrix.kmi }}.ko
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The publish: every module the matrix built, the pinned loader, and the feed that serves them.
  #
  # One job rather than one per variant, because the feed is a single file and three writers racing to
  # rewrite it is three conflicts to resolve. The artifacts are what the matrix produced, so a publish
  # cannot contain a module this run did not build - and the manifest below is why it can still name
  # the commit each one came from.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: publish susfs tiers
    needs: module
    if: inputs.publish
    runs-on: ubuntu-latest
    concurrency:
      # The feed is one file: two publishes at once would commit over each other.
      group: publish-susfs
      cancel-in-progress: false
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7
        with:
          # The full history, because this job commits onto the branch it read.
          fetch-depth: 0

      - name: Collect what the matrix built
        uses: actions/download-artifact@v7
        with:
          # Not merged: the artifact's name carries the variant, and a flat download would have each
          # variant's `susfs_guard_lkm-<kmi>.ko` overwrite the last one's.
          pattern: susfs-lkm-*
          path: artifacts

      - name: Place them per variant, and write the manifest
        run: |
          set -eu
          # The layout is the feed's: one directory per variant, which is also what makes "all of
          # them" visible in the repository rather than only in the JSON. Only the variants *this run
          # built* are cleared - a one-variant publish that wiped the others left their feed entries
          # pointing at files that no longer existed, which is worse than not publishing at all.
          python3 - <<'PY'
          import json, os, pathlib, shutil

          # Branch per variant; each one is resolved to its commit below, before the feed is written.
          refs = json.loads(os.environ["SUSFS_REFS"])
          versions = json.loads(os.environ["SUSFS_VERSIONS"])
          # Cleared once per variant this run built, *before* anything is placed: doing it inside the
          # loop below would clear the directory again for every KMI of the same variant, wiping the
          # module the previous artifact had just been copied into.
          built = sorted({item.name.split("-")[2] for item in pathlib.Path("artifacts").glob("susfs-lkm-*")})
          for variant in built:
              shutil.rmtree(pathlib.Path("susfs") / variant, ignore_errors=True)

          # The commit each variant's branch resolved to *this run*. Resolved here, after the modules
          # were built, and recorded in the feed's `source.ref`: with the branch as the input, this is
          # the only thing that makes an artifact answerable to a revision.
          import subprocess
          for variant, branch in refs.items():
              head = subprocess.run(
                  ["git", "ls-remote", "https://github.com/" + os.environ["SUSFS_REPO"] + ".git",
                   "refs/heads/" + branch],
                  capture_output=True, text=True, check=True,
              ).stdout.split()
              if not head:
                  raise SystemExit(f"upstream has no branch {branch} for variant {variant}")
              print(f"{variant}: {branch} -> {head[0][:12]}")
              refs[variant] = head[0]

          records = {}
          for directory in sorted(pathlib.Path("artifacts").glob("susfs-lkm-*")):
              parts = directory.name.split("-")          # susfs-lkm-<variant>-<kmi...>
              variant = parts[2]
              modules = sorted(directory.glob("susfs_guard_lkm-*.ko"))
              if not modules:
                  raise SystemExit(f"{directory} carries no built module")
              target = pathlib.Path("susfs") / variant
              target.mkdir(parents=True, exist_ok=True)
              placed = []
              for module in modules:
                  destination = target / module.name
                  shutil.copyfile(module, destination)
                  placed.append(str(destination).replace(os.sep, "/"))
              records.setdefault(
                  variant,
                  {"variant": variant, "ref": refs[variant], "version": versions.get(variant), "modules": []},
              )["modules"] += placed
          manifest = [records[variant] for variant in ("stable", "preview", "legacy", "samsung") if variant in records]
          if not manifest:
              raise SystemExit("nothing was built, so there is nothing to publish")
          with open("susfs-manifest.json", "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2)
          for record in manifest:
              print(f"{record['variant']:<8} {len(record['modules'])} module(s) from {record['ref'][:12]}")
          PY
          find susfs -name '*.ko' | sort

      - name: The loader, resolved from upstream's newest release
        run: |
          set -eu
          # Resolved, not pinned. Upstream tags a release per build and the asset moves with it, so a
          # fixed URL and digest rot the moment they publish again - which is exactly what happened, and
          # why this step exists in this shape.
          #
          # `releases?per_page=1` rather than `releases/latest`: upstream's newest is a *prerelease* (its
          # dev line), and `latest` excludes those, so it would hand back an older asset.
          url=$(curl -sSL "https://api.github.com/repos/$SUSFS_REPO/releases?per_page=1" \
            | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          if not releases:
              raise SystemExit('upstream publishes no release at all')
          release = releases[0]
          asset = next((a for a in release['assets'] if a['name'] == sys.argv[1]), None)
          if not asset:
              raise SystemExit(f\"release {release['tag_name']} carries no {sys.argv[1]} asset\")
          print(asset['browser_download_url'], file=sys.stderr)
          print(release['tag_name'], asset['size'], asset['browser_download_url'])
          " "$LOADER_ASSET" 2>/dev/null)
          tag=$(echo "$url" | cut -d' ' -f1)
          size=$(echo "$url" | cut -d' ' -f2)
          asset_url=$(echo "$url" | cut -d' ' -f3)
          echo "loader: $tag -> $asset_url ($size bytes)"
          curl -sSLo susfs/susfs_insmod "$asset_url"
          actual=$(stat -c %s susfs/susfs_insmod)
          [ "$actual" = "$size" ] || {
            echo "::error::the loader downloaded is $actual bytes, the release declares $size"; exit 1; }
          # The one property this file has to have, taken from the binary rather than from its name: it
          # is the program that resolves the module's unexported symbols out of /proc/kallsyms.
          grep -qa kallsyms susfs/susfs_insmod || {
            echo "::error::the asset is not the loader: it does not mention kallsyms"; exit 1; }
          echo "sha256: $(sha256sum susfs/susfs_insmod | cut -d' ' -f1) (computed here, recorded in the feed)"
          ls -l susfs/

      - name: Write the feed
        run: |
          python3 tools/susfs_feed.py \
            --repo . \
            --manifest susfs-manifest.json \
            --loader susfs/susfs_insmod \
            --repository "$SUSFS_REPO" \
            --url-prefix "$URL_PREFIX"
          echo "=== support/susfs-v1.json ==="
          cat support/susfs-v1.json

      - name: Every entry the feed serves is a file this commit carries
        run: |
          # The invariant a one-variant publish broke once: a variant this run did not build keeps its
          # entry, so its artifacts have to still be here. Checked against the local files by size and
          # digest, which is also what a client checks them against after downloading them.
          python3 tools/susfs_feed.py --repo . --verify

      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The flat layout this tier was first published with: the modules moved under a directory per
          # variant, so files beside the loader are removed rather than left to look current. The
          # pathspec is quoted and scoped to this directory - unquoted, the shell hands git the literal
          # `susfs/*.ko`, and a git pathspec's `*` matches across `/`, so it deleted every per-variant
          # module after the check above had passed and before the commit.
          # `glob` magic so the `*` cannot cross a `/`: without it the pathspec also matched every
          # per-variant module, which is how a publish deleted them after the check above had passed and
          # before the commit.
          git rm -q --ignore-unmatch -- ':(top,glob)susfs/*.ko'
          git add susfs support/susfs-v1.json
          # The invariant that actually matters, checked against the index rather than the worktree:
          # every file the feed serves has to be tracked by the commit about to be made. The check above
          # reads the worktree, and the failure this guards was a deletion that happened between the two.
          python3 tools/susfs_feed.py --repo . --check-index
          if git diff --cached --quiet; then
            echo "nothing changed: the same variants, built from the same commits, publish the same bytes"
            exit 0
          fi
          git commit -q -m "build(payloads): publish the susfs tier for ${{ github.run_id }}" \
            -m "stable, preview and legacy, built from the commits pinned in the SUSFS LKM workflow."
          # Rebased before pushing for the same reason the KernelSU publishes are: this file is written
          # by one job while others may be committing to the repository.
          git pull --rebase --autostash
          git push
